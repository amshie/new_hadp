name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Synthetic data only. No real patient data is ever present in CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-types-test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hadp_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hadp_test
      TEST_APP_DATABASE_URL: postgresql+psycopg://hadp_app:hadp_app@localhost:5432/hadp_test
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: ci-only-not-a-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hadp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install JS dependencies
        run: pnpm install

      - name: Generate API client
        # src/generated/schema.ts is gitignored and derived from the committed openapi.json
        # (offline, deterministic — no running server). Regenerate it so typecheck/test resolve it.
        run: pnpm gen:client

      - name: Install API dependencies
        run: cd apps/api && uv sync

      - name: Provision app role and test database
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d hadp -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='hadp_app') THEN CREATE ROLE hadp_app LOGIN PASSWORD 'hadp_app' NOSUPERUSER NOCREATEDB NOCREATEROLE; END IF; END \$\$;"
          psql -h localhost -U postgres -d hadp -v ON_ERROR_STOP=1 -c \
            "SELECT 1 FROM pg_database WHERE datname='hadp_test'" | grep -q 1 || \
          psql -h localhost -U postgres -d hadp -v ON_ERROR_STOP=1 -c "CREATE DATABASE hadp_test OWNER postgres"

      - name: Migrate test database
        run: cd apps/api && uv run alembic upgrade head

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: |
          cd apps/api && uv run pytest
          cd ../.. && pnpm -r --if-present test

  web-build-smoke:
    # Production `next build`, a browserless route smoke and the browser test of the clinic
    # workflow (Playwright) over the governed path: API (dev mode, non-superuser hadp_app
    # role, RLS enforced) + `next start` on the seeded synthetic data set. Catches broken
    # builds, broken route guards, a missing synthetic-data banner, and a workflow step that
    # no longer works through the UI before merge. Synthetic data only.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      # Admin DSN: Alembic migrations + the synthetic seeder only.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hadp
      # App DSN: the API server runs as the non-superuser role, same as production posture.
      APP_DATABASE_URL: postgresql+psycopg://hadp_app:hadp_app@localhost:5432/hadp
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: ci-only-not-a-secret
      API_BASE_URL: http://127.0.0.1:8000
      WEB_BASE_URL: http://127.0.0.1:3000
      # The web server reaches the API from this address: the API takes its word for a
      # client's address (apps/api/src/hadp_api/security/client_address.py). The route smoke
      # below checks that the address arrives.
      TRUSTED_PROXIES: 127.0.0.1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hadp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        # Rate limiting (P-pre-1) is FAIL-CLOSED: the API refuses throttled surfaces
        # without a reachable Redis, so the smoke stack must provide one.
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install JS dependencies
        run: pnpm install

      - name: Generate API client
        run: pnpm gen:client

      - name: Install API dependencies
        run: cd apps/api && uv sync

      - name: Provision app role
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d hadp -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='hadp_app') THEN CREATE ROLE hadp_app LOGIN PASSWORD 'hadp_app' NOSUPERUSER NOCREATEDB NOCREATEROLE; END IF; END \$\$;"

      - name: Migrate and seed (synthetic data)
        run: |
          cd apps/api
          uv run alembic upgrade head
          uv run python -m hadp_api.scripts.seed

      - name: Start an S3 endpoint for the browser test (a test double)
        # A laboratory file is stored before it is read, and the browser test uploads one. The
        # S3 test double docker-compose.yml runs (moto), here in a process rather than a
        # container: the API reaches it over HTTP with boto3, on its default endpoint
        # and with its default development credentials — the same code path as an object
        # store. It says nothing about which store a deployment uses.
        run: |
          cd apps/api
          nohup uv run --with 'moto[server]==5.2.3' moto_server -H 127.0.0.1 -p 59000 > /tmp/s3.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:59000/moto-api/ > /dev/null && break; sleep 1;
          done
          curl -sf http://127.0.0.1:59000/moto-api/ > /dev/null
          uv run python - <<'PY'
          import boto3

          from hadp_api.config import get_settings

          s = get_settings()
          boto3.client(
              "s3",
              endpoint_url=s.s3_endpoint_url,
              region_name=s.s3_region,
              aws_access_key_id=s.s3_access_key_id,
              aws_secret_access_key=s.s3_secret_access_key,
          ).create_bucket(
              Bucket=s.s3_bucket_source_documents,
              CreateBucketConfiguration={"LocationConstraint": s.s3_region},
          )
          print("bucket ready")
          PY

      - name: Build web app (next build)
        run: pnpm --filter @hadp/web build

      - name: Start API and web servers
        run: |
          cd apps/api && nohup uv run uvicorn hadp_api.main:app --host 127.0.0.1 --port 8000 --no-proxy-headers > /tmp/api.log 2>&1 &
          cd "$GITHUB_WORKSPACE" && nohup pnpm --filter @hadp/web start > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null && break; sleep 1;
          done
          curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/login > /dev/null && break; sleep 1;
          done
          curl -sf http://127.0.0.1:3000/login > /dev/null

      - name: Web route smoke
        # WEB_SMOKE_RELEASE: also approve and release the seeded report through the API, so
        # the review page's wording is checked as a draft, approved and released.
        # WEB_SMOKE_FORWARDED: also check that a client's address reaches the API's limiter.
        env:
          WEB_SMOKE_RELEASE: "1"
          WEB_SMOKE_FORWARDED: "1"
        run: cd apps/api && uv run python ../../scripts/smoke_web.py

      - name: Install Chromium for the browser test
        run: pnpm --filter @hadp/web exec playwright install --with-deps chromium

      - name: Browser test of the clinic workflow (Playwright)
        # Against the production build that is already serving. Sign-in is limited to 10 per
        # minute per client address: the route smoke above signs in three times, this suite
        # three times (once per role) — six, even if both fell into one minute.
        run: make test-e2e

      - name: Upload the Playwright report and traces
        # Synthetic data only: the accounts, the patient and the laboratory file are made up.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "===== api.log ====="; cat /tmp/api.log || true
          echo "===== web.log ====="; cat /tmp/web.log || true
          echo "===== s3.log ====="; tail -n 50 /tmp/s3.log || true

  container-images:
    # Builds the three images from the lockfiles, boots the production-shaped stack and
    # asserts its posture (scripts/smoke_stack.sh), then scans the images for known
    # vulnerabilities. Nobody can sign in to a production-mode stack yet, so this proves boot
    # and posture, not the workflow (infra/docker/README.md). It holds no patient data, real
    # or synthetic.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Development infrastructure (make db-up)
        # What a developer starts first (docker-compose.yml): Postgres, Redis and the S3 test
        # double, whose bucket must exist when db-up returns. Nothing else in CI starts this
        # file — its object store stopped being pullable once and nobody saw. It holds no data.
        run: |
          make db-up
          curl -sf -o /dev/null http://127.0.0.1:59000/hadp-source-documents
          make db-down

      - name: Build the images and run the stack smoke
        run: make stack-smoke

      - name: Demo stack smoke
        # The stack a server runs to show the product (infra/docker/compose.demo.yml), with
        # the images built above: nothing is served without the gate, the workspace renders
        # behind it for a seeded account's session, and a visitor is counted under the
        # address the proxy saw. Not checked here: the sign-in form's own request through
        # the proxy (it needs a browser) and a public certificate. Synthetic data only.
        run: ./scripts/smoke_demo.sh

      - name: Install the image scanner (grype)
        # A pinned release binary whose checksum is verified here — the pattern of the
        # gitleaks step below, not a third-party action referenced by a tag that can move.
        run: |
          VERSION=0.120.1
          SHA256=0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d
          curl -sSfL -o grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v${VERSION}/grype_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  grype.tar.gz" | sha256sum -c -
          tar -xzf grype.tar.gz grype
          ./grype version

      - name: Scan the images
        # Blocking on a HIGH or CRITICAL finding for which a fix exists. A finding WITHOUT a
        # fix does not fail the job — nothing can be done about it here except choosing
        # another base image — and `--only-fixed` alone would not even print it: it is shown
        # as suppressed (`--show-suppressed`), so an unfixed HIGH or CRITICAL is at least seen.
        # The scanner downloads its vulnerability database at run time: a newly published
        # advisory, or an outage of that download, can turn an unrelated pull request red.
        run: |
          status=0
          for image in hadp-api:local hadp-worker:local hadp-web:local; do
            echo "===== $image"
            ./grype "$image" --only-fixed --show-suppressed --fail-on high || status=1
            # Where each HIGH or CRITICAL finding sits: it is only as fixable as its place
            # (the application's dependencies, or something the base image brought along).
            # For the reader of the log only — this listing never decides the job.
            ./grype "$image" --only-fixed -o json 2> /dev/null \
              | jq -r '.matches[]
                  | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
                  | "  \(.artifact.name)@\(.artifact.version)  \(.vulnerability.id)  \(.artifact.locations[0].path)"' \
              | sort -u
          done
          exit "$status"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
      - name: gitleaks (scan committed history)
        # Run the CLI directly rather than gitleaks-action@v2: the action's PR mode calls the GitHub
        # API and fails on the default token ("Resource not accessible by integration"), so it never
        # actually scans. `gitleaks git` scans commit history — exactly what is published — and honors
        # the .gitleaks.toml allowlist, exiting non-zero on any finding outside it. fetch-depth: 0
        # (above) gives it the full history.
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v3
      - name: pip-audit (Python dependencies)
        # Blocking: any advisory fails CI. The allowlist that previously carried the starlette
        # (via FastAPI) and pytest advisories was cleared by the dependency-upgrade slice
        # (docs/notes/0008-dependency-advisories.md): fastapi 0.115->0.139, starlette 0.46->1.3.1,
        # pytest 8->9. No `--ignore-vuln` entries remain — a new advisory now fails outright.
        run: |
          cd apps/api && uv sync
          uv run --with pip-audit pip-audit
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: pnpm audit (JS dependencies)
        # Blocking on high/critical (moderate advisories are reported by Dependabot, not gated here).
        run: pnpm install && pnpm audit --audit-level high
