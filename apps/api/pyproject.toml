[project]
name = "hadp-api"
version = "0.0.0"
description = "Longevity Health Analytics Platform — FastAPI backend (synthetic data only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139,<0.140",
    # starlette ships transitively via FastAPI; we pin its floor >=1.3.1 directly to guarantee
    # every advisory cleared in the 0008 slice stays cleared regardless of FastAPI's own range
    # (docs/notes/0008-dependency-advisories.md).
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.30,<0.35",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "python-multipart>=0.0.9,<0.1",
    "boto3>=1.34,<2",
    "redis>=5.0,<6",
    # Text layer of stored PDFs for the lab intake agent (MIT; pdfminer.six underneath).
    "pdfplumber>=0.11,<0.12",
    # Pulled in by pdfplumber; pinned to a release that clears the PYSEC-2026 advisories
    # pip-audit blocks on (11.3.0 was flagged; fixes land in 12.3.0).
    "pillow>=12.3,<13",
    "mcp>=1.10,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.27,<0.29",
    "ruff>=0.6,<0.13",
    "mypy>=1.11,<2",
    "boto3-stubs[s3]>=1.34,<2",
    "types-redis>=4.6,<5",
    # Generates the synthetic PDF fixtures of the intake golden cases (BSD).
    "reportlab>=4.2,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hadp_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"] # FastAPI uses function calls (Depends/File) in argument defaults

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pdfplumber.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:hadp_api.*"]
