# Local development infrastructure for the Longevity Health Analytics Platform.
#
# SAFETY: local/dev only. Synthetic data only — never point this at real patient data.
# Ports are deliberately non-default to avoid colliding with the read-only `hadp-alpha`
# reference stack (which holds host port 55432). All data stays on the local machine.
name: newhadp

services:
  postgres:
    image: postgres:16-alpine
    # Host port 55433 -> container 5432. (55432 is taken by the hadp-alpha reference.)
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hadp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hadp"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Object storage for source documents: an S3 TEST DOUBLE (moto), the one CI and the demo
  # stack use. The MinIO images this file named can no longer be pulled (Docker Hub answers
  # 404 for minio/minio and minio/mc). The API reaches it over HTTP with boto3, the code path
  # of a real object store. It keeps objects IN MEMORY and accepts any credentials: when it
  # stops, the uploaded files are gone while the database still names them. Which store a
  # deployment uses is an open vendor decision, not made here.
  s3:
    image: motoserver/moto:5.2.3
    ports:
      - "127.0.0.1:59000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request as u; u.urlopen("http://127.0.0.1:5000/moto-api/", timeout=3)'
      interval: 3s
      timeout: 5s
      retries: 30

  # One-shot, on every start (`make db-up` runs it): the double forgets its bucket when it
  # stops. Python and boto3 come with the moto image. The credentials are .env.example's —
  # the double checks none.
  s3-init:
    image: motoserver/moto:5.2.3
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["python", "-c"]
    command:
      - |
        import boto3
        from botocore.exceptions import ClientError

        client = boto3.client(
            "s3",
            endpoint_url="http://s3:5000",
            region_name="eu-central-1",
            aws_access_key_id="minioadmin",
            aws_secret_access_key="minioadmin",
        )
        try:
            client.create_bucket(
                Bucket="hadp-source-documents",
                CreateBucketConfiguration={"LocationConstraint": "eu-central-1"},
            )
        except ClientError as exc:
            if exc.response["Error"]["Code"] != "BucketAlreadyOwnedByYou":
                raise
        print("bucket ready")

volumes:
  postgres-data:
