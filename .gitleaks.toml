# gitleaks configuration. Extends the upstream default rule set and allowlists
# only the obviously-fake placeholders used in example/config files. Real secrets
# must never be committed; CI fails the build on any finding outside this allowlist.
title = "HADP secret scan"

[extend]
useDefault = true

[allowlist]
description = "Known-safe local/dev placeholders (synthetic, non-secret)"
paths = [
  '''\.env\.example$''',
  '''docker-compose\.yml$''',
  '''README\.md$''',
]
regexes = [
  '''dev-only-not-a-secret-change-me''',
  '''minioadmin''',
  '''postgres:postgres''',
  '''hadp_app:hadp_app''',
  # A synthetic-Alpha patient-view demo token from a local-only, constantly-reseeded
  # dev DB (127.0.0.1, 14-day TTL, synthetic patient) that was accidentally pasted
  # into a test fixture and immediately replaced in the same PR. It has no
  # real-world value; the exact-string allowlist keeps the history scan green
  # without a history rewrite and cannot mask any other finding.
  '''ZfiTR8X4WHV47zNVdMURza''',
]
